<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  .senno{
    --background:38 14% 97%; --foreground:220 9% 12%;
    --card:0 0% 100%; --card-foreground:220 9% 12%; --popover:0 0% 100%;
    --primary:42 53% 42%; --primary-foreground:225 11% 7%; --primary-text:42 53% 33%;
    --secondary:38 18% 90%; --secondary-foreground:25 47% 18%;
    --muted:38 18% 90%; --muted-foreground:25 15% 38%;
    --accent:38 18% 90%; --accent-foreground:25 47% 18%;
    --destructive:0 72% 48%; --destructive-bg:0 80% 96%;
    --border:38 20% 85%; --input:38 20% 85%; --ring:42 65% 52%;
    --ok:142 55% 30%; --ok-bg:142 50% 91%;
    --warn:32 80% 32%; --warn-bg:38 88% 90%;
    --shadow:220 28% 22%; --shadow-a:0.07;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .senno[data-theme="dark"]{
    --background:225 11% 7%; --foreground:38 33% 96%;
    --card:220 9% 11%; --card-foreground:38 33% 96%; --popover:220 9% 11%;
    --primary:42 65% 58%; --primary-foreground:225 11% 7%; --primary-text:42 65% 58%;
    --secondary:220 9% 16%; --secondary-foreground:38 33% 96%;
    --muted:220 9% 16%; --muted-foreground:38 15% 65%;
    --accent:220 9% 16%; --accent-foreground:38 33% 96%;
    --destructive:0 63% 50%; --destructive-bg:0 45% 14%;
    --border:220 9% 18%; --input:220 9% 18%; --ring:42 65% 58%;
    --ok:142 58% 64%; --ok-bg:142 45% 15%;
    --warn:38 85% 66%; --warn-bg:36 55% 15%;
    --shadow:0 0% 0%; --shadow-a:0.4;
  }
  .senno input[type="date"]{ color-scheme:light; }
  .senno[data-theme="dark"] input[type="date"]{ color-scheme:dark; }
  /* topbar search: collapses to icon, expands right-to-left on hover; 0s grace before collapsing */
  .senno-search{ position:relative; width:38px; height:38px; flex:none; }
  .senno-search-box{ position:absolute; top:0; right:0; height:38px; width:38px; display:flex; align-items:center; gap:8px; padding:0 11px; border-radius:9px; border:1px solid hsl(var(--border)); background:hsl(var(--background)); color:hsl(var(--muted-foreground)); font-size:12.5px; overflow:hidden; white-space:nowrap; cursor:pointer; transition:width .34s cubic-bezier(.4,0,.2,1), background .22s ease, border-color .22s ease, box-shadow .22s ease; transition-delay:0s; }
  .senno-search:hover .senno-search-box, .senno-search-box:focus-within{ width:240px; background:hsl(var(--background)); border-color:hsl(var(--input)); cursor:text; transition-delay:0s; }
  .senno-search-box:focus-within{ border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsl(var(--ring)/0.18); }
  .senno-theme-btn{ position:relative; overflow:hidden; }
  .senno-theme-ico{ position:absolute; top:50%; left:50%; width:17px; height:17px; margin:-8.5px 0 0 -8.5px; display:inline-flex; transition:transform .5s cubic-bezier(.34,1.3,.5,1), opacity .35s ease; }
  .senno-theme-sun{ transform:rotate(0deg) scale(1); opacity:1; }
  .senno-theme-moon{ transform:rotate(-90deg) scale(.35); opacity:0; }
  .senno[data-theme="dark"] .senno-theme-sun{ transform:rotate(90deg) scale(.35); opacity:0; }
  .senno[data-theme="dark"] .senno-theme-moon{ transform:rotate(0deg) scale(1); opacity:1; }
  /* notification bell: small resonating shake on click */
  @keyframes senno-bell-ring{ 0%{transform:rotate(0);} 15%{transform:rotate(11deg);} 30%{transform:rotate(-9deg);} 45%{transform:rotate(6deg);} 60%{transform:rotate(-4deg);} 75%{transform:rotate(2deg);} 100%{transform:rotate(0);} }
  .senno-bell-ico{ transform-origin:top center; }
  .senno-bell-ring-a{ animation:senno-bell-ring .7s cubic-bezier(.36,.07,.19,.97); }
  .senno-bell-ring-b{ animation:senno-bell-ring .7s cubic-bezier(.36,.07,.19,.97); }

  /* responsive: stack multi-column grids on tablet/portrait */
  @media (max-width:1024px){ .senno-2col{ grid-template-columns:1fr !important; } .senno-3col{ grid-template-columns:1fr 1fr !important; } }
  @media (max-width:660px){ .senno-3col{ grid-template-columns:1fr !important; } }
</style>
</helmet>

<div class="senno" data-theme="{{ theme }}" data-font="inter" style="background:hsl(var(--background)); color:hsl(var(--foreground)); height:100vh; box-sizing:border-box; overflow:hidden; line-height:1.45;">

  <div data-screen-label="Exportações" style="width:100%; height:100%; min-height:0; display:flex; overflow:hidden; background:hsl(var(--background));">

    <!-- SIDEBAR -->
    <aside style="width:236px; flex:none; background:hsl(var(--card)); border-right:1px solid hsl(var(--border)); display:flex; flex-direction:column; padding:18px 14px;">
      <div style="display:flex; align-items:center; gap:10px; padding:6px 8px 18px;">
        <div style="width:34px; height:34px; border-radius:9px; background:hsl(var(--primary)); display:flex; align-items:center; justify-content:center; flex:none;">
          <span style="color:hsl(var(--primary-foreground)); font-weight:700; font-size:17px;">B</span>
        </div>
        <div style="min-width:0;">
          <div style="font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Clínica Bellavie</div>
          <div style="font-size:11px; color:hsl(var(--muted-foreground));">Plano Premium</div>
        </div>
      </div>
      <nav style="display:flex; flex-direction:column; gap:2px;">
        <sc-for list="{{ navMain }}" as="item" hint-placeholder-count="12">
          <a href="#" onClick="{{ item.onClick }}" style="display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:8px; font-size:13.5px; font-weight:{{ item.weight }}; text-decoration:none; color:{{ item.color }}; background:{{ item.bg }};" style-hover="background:hsl(var(--accent));">
            <span style="width:18px; height:18px; display:inline-flex; flex:none; color:{{ item.iconColor }};" dangerouslySetInnerHTML="{{ item.icon }}"></span>
            <span style="flex:1; white-space:nowrap;">{{ item.label }}</span>
          </a>
        </sc-for>
      </nav>
      <div style="margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; background:hsl(var(--muted));">
        <div style="width:32px; height:32px; border-radius:99px; background:hsl(var(--primary)/0.2); display:flex; align-items:center; justify-content:center; flex:none; color:hsl(var(--primary-text)); font-weight:600; font-size:12.5px;">HC</div>
        <div style="min-width:0; flex:1;">
          <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Dra. Helena Costa</div>
          <div style="font-size:11px; color:hsl(var(--muted-foreground));">Proprietária</div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div style="flex:1; min-width:0; min-height:0; display:flex; flex-direction:column;">

      <!-- TOPBAR -->
      <header style="flex:none; display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid hsl(var(--border)); background:hsl(var(--card));">
        <div style="flex:1; min-width:0;">
          <h1 style="margin:0; font-size:clamp(22px, 0.5vw + 18px, 27px); font-weight:600; letter-spacing:-0.01em;">Exportações</h1>
        </div>
        <div style="display:flex; align-items:center; gap:9px;">
          <div class="senno-search">
            <div class="senno-search-box">
              <span style="width:15px;height:15px;display:inline-flex;flex:none;" dangerouslySetInnerHTML="{{ icoSearch }}"></span>
              <input type="text" placeholder="Buscar paciente…" style="flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:inherit; font-size:12.5px; color:hsl(var(--foreground));" />
            </div>
          </div>
          <button onClick="{{ toggleTheme }}" title="{{ themeTitle }}" class="senno-theme-btn" style="width:38px; height:38px; border-radius:9px; border:1px solid hsl(var(--border)); background:hsl(var(--background)); color:hsl(var(--foreground)); display:flex; align-items:center; justify-content:center; cursor:pointer;" style-hover="background:hsl(var(--accent));">
            <span class="senno-theme-ico senno-theme-sun" dangerouslySetInnerHTML="{{ icoSun }}"></span>
            <span class="senno-theme-ico senno-theme-moon" dangerouslySetInnerHTML="{{ icoMoon }}"></span>
          </button>
          <div class="senno-notif" style="position:relative;">
            <button onClick="{{ toggleNotif }}" title="Notificações" style="position:relative; width:38px; height:38px; border-radius:9px; border:1px solid hsl(var(--border)); background:hsl(var(--background)); color:hsl(var(--foreground)); display:flex; align-items:center; justify-content:center; cursor:pointer;" style-hover="background:hsl(var(--accent));">
              <span class="senno-bell-ico {{ bellClass }}" onAnimationEnd="{{ bellAnimEnd }}" style="width:17px;height:17px;display:inline-flex; transform-origin:top center;" dangerouslySetInnerHTML="{{ icoBell }}"></span>
              <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}">
                <span style="position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:99px; background:hsl(var(--destructive)); border:1.5px solid hsl(var(--card));"></span>
              </sc-if>
            </button>
            <sc-if value="{{ notifOpen }}" hint-placeholder-val="">
              <div onClick="{{ closeNotif }}" style="position:fixed; inset:0; z-index:40;"></div>
              <div style="position:absolute; top:46px; right:0; width:362px; background:hsl(var(--popover)); border:1px solid hsl(var(--border)); border-radius:12px; box-shadow:0 16px 40px -12px hsl(var(--shadow)/calc(var(--shadow-a) * 3.5)); z-index:50; overflow:hidden;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px 10px;">
                  <span style="display:flex; align-items:center; gap:8px; font-size:clamp(13px, 0.14vw + 11.2px, 14.3px); font-weight:600; color:hsl(var(--foreground));">Notificações<sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px; font-weight:600; padding:1px 7px; border-radius:99px; background:hsl(var(--primary)/0.16); color:hsl(var(--primary-text)); font-variant-numeric:tabular-nums;">{{ unreadCount }}</span></sc-if></span>
                  <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><button onClick="{{ markAllRead }}" style="border:none; background:transparent; font-size:11.5px; font-weight:600; color:hsl(var(--primary-text)); cursor:pointer; padding:2px 4px; font-family:inherit;" style-hover="text-decoration:underline;">Marcar todas como lidas</button></sc-if>
                </div>
                <div style="display:flex; flex-direction:column; padding:0 6px 6px; max-height:344px; overflow-y:auto;">
                  <sc-for list="{{ notifItems }}" as="n" hint-placeholder-count="4">
                    <button onClick="{{ n.onClick }}" style="display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; padding:10px 8px; border:none; background:{{ n.rowBg }}; border-radius:8px; cursor:pointer;" style-hover="background:hsl(var(--accent));">
                      <span style="width:32px; height:32px; border-radius:99px; flex:none; display:flex; align-items:center; justify-content:center; background:{{ n.iconBg }}; color:{{ n.iconColor }};"><span style="width:15px;height:15px;display:inline-flex;" dangerouslySetInnerHTML="{{ n.icon }}"></span></span>
                      <span style="flex:1; min-width:0;">
                        <span style="display:block; font-size:12.5px; font-weight:{{ n.titleWeight }}; color:hsl(var(--foreground));">{{ n.title }}</span>
                        <span style="display:block; font-size:11.5px; color:hsl(var(--muted-foreground)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ n.sub }}</span>
                      </span>
                      <span style="flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                        <span style="font-size:10.5px; color:hsl(var(--muted-foreground)); white-space:nowrap;">{{ n.time }}</span>
                        <sc-if value="{{ n.unread }}" hint-placeholder-val=""><span style="width:7px; height:7px; border-radius:99px; background:hsl(var(--primary)); flex:none;"></span></sc-if>
                      </span>
                    </button>
                  </sc-for>
                </div>
                <div style="display:flex; align-items:center; justify-content:center; padding:9px 14px; border-top:1px solid hsl(var(--border)); background:hsl(var(--muted)/0.4);">
                  <a href="#" style="font-size:12px; font-weight:600; color:hsl(var(--primary-text)); text-decoration:none;">Ver todas as notificações</a>
                </div>
              </div>
            </sc-if>
          </div>
          <button onClick="{{ onNewLead }}" style="height:38px; padding:0 15px; border-radius:9px; border:none; background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); font-size:clamp(13px, 0.14vw + 11.2px, 14.3px); font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px;" style-hover="filter:brightness(1.05);">
            <span style="width:15px;height:15px;display:inline-flex;" dangerouslySetInnerHTML="{{ icoPlus }}"></span>
            Novo lead
          </button>
        </div>
      </header>

      <!-- BODY -->
      <div style="flex:1; min-height:0; overflow-y:auto; padding:18px 24px; display:flex; flex-direction:column; gap:16px;">

        <!-- PERÍODO -->
        <div style="background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:13px; box-shadow:0 1px 2px hsl(var(--shadow)/var(--shadow-a)); padding:18px 20px;">
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <span style="width:34px; height:34px; flex:none; border-radius:9px; background:hsl(var(--primary)/0.14); color:hsl(var(--primary-text)); display:flex; align-items:center; justify-content:center;">
              <span style="width:18px;height:18px;display:inline-flex;" dangerouslySetInnerHTML="{{ icoCalendar }}"></span>
            </span>
            <div style="flex:none;">
              <div style="font-size:16px; font-weight:600;">Período</div>
            </div>
            <div style="display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-left:auto;">
              <div style="display:flex; gap:14px;">
                <label style="display:flex; flex-direction:column; gap:5px; font-size:11.5px; font-weight:600; color:hsl(var(--muted-foreground));">De
                  <input type="date" value="{{ dateFrom }}" onChange="{{ onFrom }}" style="height:38px; padding:0 12px; border-radius:9px; border:1px solid hsl(var(--input)); background:hsl(var(--background)); color:hsl(var(--foreground)); font-family:inherit; font-size:clamp(13px, 0.14vw + 11.2px, 14.3px); font-variant-numeric:tabular-nums;" style-focus="outline:none; border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsl(var(--ring)/0.18);" />
                </label>
                <label style="display:flex; flex-direction:column; gap:5px; font-size:11.5px; font-weight:600; color:hsl(var(--muted-foreground));">Até
                  <input type="date" value="{{ dateTo }}" onChange="{{ onTo }}" style="height:38px; padding:0 12px; border-radius:9px; border:1px solid hsl(var(--input)); background:hsl(var(--background)); color:hsl(var(--foreground)); font-family:inherit; font-size:clamp(13px, 0.14vw + 11.2px, 14.3px); font-variant-numeric:tabular-nums;" style-focus="outline:none; border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsl(var(--ring)/0.18);" />
                </label>
              </div>
              <div style="position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:3px; border-radius:9px; background:hsl(var(--muted)); border:1px solid hsl(var(--border));">
                <div style="{{ presetPill }}"></div>
                <sc-for list="{{ presets }}" as="p" hint-placeholder-count="4">
                  <button onClick="{{ p.onClick }}" style="{{ p.style }}" style-hover="background:hsl(var(--primary)/0.22); color:hsl(var(--primary-text));">{{ p.label }}</button>
                </sc-for>
              </div>
            </div>
          </div>
        </div>

        <!-- GRID DE EXPORTAÇÕES -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(322px,1fr)); gap:18px;">
          <sc-for list="{{ exports }}" as="e" hint-placeholder-count="10">
            <div style="position:relative; display:flex; flex-direction:column; gap:16px; background:hsl(var(--card)); border:1px solid {{ e.cardBorder }}; border-radius:15px; box-shadow:0 1px 2px hsl(var(--shadow)/var(--shadow-a)); padding:24px 24px 22px; min-height:196px;" style-hover="border-color:hsl(var(--primary)/0.5);">
              <div style="display:flex; align-items:center; gap:13px;">
                <span style="width:44px; height:44px; flex:none; border-radius:12px; background:{{ e.iconBg }}; color:{{ e.iconColor }}; display:flex; align-items:center; justify-content:center;">
                  <span style="width:23px;height:23px;display:inline-flex;" dangerouslySetInnerHTML="{{ e.icon }}"></span>
                </span>
                <div style="flex:1; min-width:0;">
                  <span style="font-size:18px; font-weight:600; line-height:1.25;">{{ e.title }}</span>
                </div>
              </div>
              <p style="margin:0; font-size:13.5px; color:hsl(var(--muted-foreground)); line-height:1.55; flex:1;">{{ e.descMain }}</p>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <sc-for list="{{ e.actions }}" as="a" hint-placeholder-count="2">
                  <button onClick="{{ a.onClick }}" style="{{ a.style }}" style-hover="{{ a.hover }}">
                    <span style="width:16px;height:16px;display:inline-flex;" dangerouslySetInnerHTML="{{ a.icon }}"></span>
                    {{ a.label }}
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:920},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;}}">
class Component extends DCLogic {
  state = { theme: this.props.defaultTheme || 'light', preset: '', dateFrom: '', dateTo: '', busy: {}, notifOpen:false, notifs:[{id:1,type:'lead',title:'Novo lead',sub:'Mariana Alves · Instagram',time:'agora',read:false},{id:2,type:'money',title:'Pagamento confirmado',sub:'R$ 1.200 · Botox · Camila Souza',time:'8 min',read:false},{id:3,type:'agenda',title:'Agendamento confirmado',sub:'Patrícia Lima · amanhã às 14h',time:'40 min',read:false},{id:4,type:'alert',title:'Tarefa atrasada',sub:'Retornar ligação · Rafael Dias',time:'1 h',read:true},{id:5,type:'agenda',title:'Novo agendamento online',sub:'Beatriz Ramos · Limpeza de pele',time:'3 h',read:true}] };

  ico(p){ return {__html:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}; }

  _notif(){
    const ic=(p)=>this.ico(p);
    const icoSun=ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>');
    const icoMoon=ic('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>');
    const icoBell=ic('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>');
    const icoUsers=ic('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>');
    const icoMoney=ic('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>');
    const icoCal=ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>');
    const icoAlert=ic('<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>');
    const tint={lead:{bg:'hsl(var(--primary)/0.16)',color:'hsl(var(--primary-text))'},money:{bg:'hsl(var(--ok-bg))',color:'hsl(var(--ok))'},agenda:{bg:'hsl(var(--accent))',color:'hsl(var(--muted-foreground))'},alert:{bg:'hsl(var(--destructive)/0.14)',color:'hsl(var(--destructive))'}};
    const icoBy={lead:icoUsers,money:icoMoney,agenda:icoCal,alert:icoAlert};
    const notifItems=this.state.notifs.map(n=>{const t=tint[n.type]||tint.agenda; return {...n, icon:icoBy[n.type]||icoBell, iconBg:t.bg, iconColor:t.color, unread:!n.read, titleWeight:n.read?500:600, rowBg:n.read?'transparent':'hsl(var(--primary)/0.05)', onClick:()=>this.setState(s=>({notifs:s.notifs.map(x=>x.id===n.id?{...x,read:true}:x)}))};});
    const unreadCount=this.state.notifs.filter(n=>!n.read).length;
    return { icoSun, icoMoon, notifOpen:this.state.notifOpen, hasUnread:unreadCount>0, unreadCount, notifItems,
      bellClass:(this.state.bellRing?'senno-bell-ring-a':''), bellAnimEnd:()=>this.setState({bellRing:false}),
      toggleNotif:()=>this.setState(s=>({bellRing:true, notifOpen:!s.notifOpen})), closeNotif:()=>this.setState({notifOpen:false}),
      markAllRead:()=>this.setState(s=>({notifs:s.notifs.map(x=>({...x,read:true}))})) };
  }

  fmt(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }

  segPill(idx, n, o){ o=o||{}; const hidden=idx<0; return 'position:absolute; top:3px; left:3px; bottom:3px; width:calc((100% - 6px)/'+n+'); transform:translateX('+(Math.max(idx,0)*100)+'%); opacity:'+(hidden?0:1)+'; background:'+(o.bg||'hsl(var(--primary))')+'; border-radius:'+(o.r||7)+'px; box-shadow:0 1px 2px hsl(var(--shadow)/var(--shadow-a)); transition:transform .34s cubic-bezier(.34,1.1,.5,1), opacity .2s ease; pointer-events:none; z-index:0;'; }
  segBtn(on, o){ o=o||{}; return 'position:relative; z-index:1; border:none; cursor:pointer; font-family:inherit; font-size:'+(o.fs||'12.5px')+'; font-weight:600; padding:'+(o.pad||'7px 14px')+'; border-radius:'+(o.r||7)+'px; background:transparent; white-space:nowrap; transition:color .25s ease; color:'+(on?(o.on||'hsl(var(--primary-foreground))'):(o.off||'hsl(var(--muted-foreground))'))+';'; }

  applyPreset(k){
    if(this.state.preset===k){ this.setState({preset:'', dateFrom:'', dateTo:''}); return; }
    const now = new Date(); let from='', to='';
    if(k==='mes'){ from=this.fmt(new Date(now.getFullYear(),now.getMonth(),1)); to=this.fmt(now); }
    else if(k==='passado'){ from=this.fmt(new Date(now.getFullYear(),now.getMonth()-1,1)); to=this.fmt(new Date(now.getFullYear(),now.getMonth(),0)); }
    else if(k==='90d'){ const f=new Date(now); f.setDate(f.getDate()-90); from=this.fmt(f); to=this.fmt(now); }
    else { from=''; to=''; }
    this.setState({preset:k, dateFrom:from, dateTo:to});
  }

  download(id){
    if(this.state.busy[id]) return;
    this.setState(s=>({busy:{...s.busy,[id]:true}}));
    setTimeout(()=>this.setState(s=>{ const b={...s.busy}; delete b[id]; return {busy:b}; }), 1300);
  }

  renderVals(){
    const I=(p)=>this.ico(p);
    const icoGrid    = I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>');
    const icoActivity= I('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>');
    const icoCalendar= I('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>');
    const icoFunnel  = I('<path d="M3 4h18l-7 8v6l-4 2v-8z"/>');
    const icoUsers   = I('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>');
    const icoMoney   = I('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>');
    const icoTarget  = I('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>');
    const icoBulb    = I('<path d="M9 18h6M10 21h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>');
    const icoSyringe = I('<rect x="3" y="3" width="7" height="7" rx="1.5"/><path d="M14 7h6M14 12h6M14 17h6M5 14v6M3 17h4"/>');
    const icoDownload= I('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>');
    const icoBell    = I('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>');
    const icoSettings= I('<path d="M22.00 12.00 L21.24 15.83 L18.28 14.60 L16.81 16.81 L19.07 19.07 L15.83 21.24 L14.60 18.28 L12.00 18.80 L12.00 22.00 L8.17 21.24 L9.40 18.28 L7.19 16.81 L4.93 19.07 L2.76 15.83 L5.72 14.60 L5.20 12.00 L2.00 12.00 L2.76 8.17 L5.72 9.40 L7.19 7.19 L4.93 4.93 L8.17 2.76 L9.40 5.72 L12.00 5.20 L12.00 2.00 L15.83 2.76 L14.60 5.72 L16.81 7.19 L19.07 4.93 L21.24 8.17 L18.28 9.40 L18.80 12.00 Z"/><circle cx="12" cy="12" r="3"/>');
    const icoSearch  = I('<circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/>');
    const icoPlus    = I('<path d="M12 5v14M5 12h14"/>');
    const icoSun     = I('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>');
    const icoMoon    = I('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>');
    const icoFileText= I('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h1"/>');
    const icoSheet   = I('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>');
    const icoReceipt = I('<path d="M4 2v20l2-1.5L8 22l2-1.5L12 22l2-1.5L16 22l2-1.5L20 22V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5 4 2z"/><path d="M8 8h8M8 12h8"/>');
    const icoCoins   = I('<circle cx="8" cy="8" r="5.5"/><path d="M18.1 6.5a5.5 5.5 0 0 1 0 11M9.5 16.5a5.5 5.5 0 0 0 8.6 0"/>');
    const icoSpinner = I('<path d="M12 3a9 9 0 1 0 9 9" opacity="0.9"/>');

    const P='hsl(var(--primary-text))', M='hsl(var(--muted-foreground))';
    const navMain = [
      {label:'Dashboard',icon:icoGrid}, {label:'Atividades',icon:icoActivity},
      {label:'Agenda',icon:icoCalendar}, {label:'Funil',icon:icoFunnel},
      {label:'Pacientes',icon:icoUsers}, {label:'Financeiro',icon:icoMoney},
      {label:'Metas',icon:icoTarget}, {label:'Insights',icon:icoBulb},
      {label:'Procedimentos',icon:icoSyringe}, {label:'Exportações',icon:icoDownload, active:true},
      {label:'Notificações',icon:icoBell}, {label:'Configurações',icon:icoSettings},
    ].map(n=>({ ...n, weight:n.active?600:500, color:n.active?P:M, iconColor:n.active?P:M, bg:n.active?'hsl(var(--accent))':'transparent', onClick:(e)=>{ if(e&&e.preventDefault)e.preventDefault(); if(this.props.onNavigate)this.props.onNavigate(n.label); } }));

    // ---- presets de período ----
    const presetDefs = [['mes','Este mês'],['passado','Mês passado'],['90d','Últimos 90 dias'],['tudo','Tudo']];
    const presets = presetDefs.map(([k,label])=>({ label, style:this.segBtn(this.state.preset===k), onClick:()=>this.applyPreset(k) }));
    const presetPill = this.segPill(presetDefs.findIndex(d=>d[0]===this.state.preset), presetDefs.length);

    // ---- botões de download ----
    const btnBase = 'display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:600; transition:background .12s, filter .12s;';
    const ghost = btnBase+' border:1px solid hsl(var(--border)); background:hsl(var(--background)); color:hsl(var(--foreground));';
    const ghostHover = 'background:hsl(var(--accent));';
    const gold = btnBase+' border:none; background:hsl(var(--primary)); color:hsl(var(--primary-foreground));';
    const goldHover = 'filter:brightness(1.05);';

    const mkActions = (id, primary)=>{
      const busy = !!this.state.busy[id];
      if(primary){
        return [{ label: busy?'Gerando…':'Baixar PDF', icon: busy?icoSpinner:icoDownload,
          style:ghost+(busy?' opacity:0.7; cursor:default;':''), hover:ghostHover, onClick:()=>this.download(id) }];
      }
      return [
        { label: busy?'Gerando…':'CSV', icon: busy?icoSpinner:icoDownload, style:ghost+(busy?' opacity:0.7; cursor:default;':''), hover:ghostHover, onClick:()=>this.download(id) },
        { label:'Excel', icon:icoSheet, style:ghost, hover:ghostHover, onClick:()=>this.download(id+'-xls') },
      ];
    };

    const defs = [
      {id:'exec', title:'Relatório executivo (PDF)', icon:icoFileText, desc:'KPIs, top procedimentos, custos e metas do período — pronto para apresentar.', scope:'period', primary:true},
      {id:'leads', title:'Leads', icon:icoFunnel, desc:'Funil comercial: contato, origem, etapa e valor estimado.', scope:'period'},
      {id:'pacientes', title:'Pacientes', icon:icoUsers, desc:'Cadastro completo com contato e histórico de visitas.', scope:'full'},
      {id:'agenda', title:'Agendamentos', icon:icoCalendar, desc:'Agenda com paciente, procedimento, status e desfecho.', scope:'period'},
      {id:'receitas', title:'Receitas', icon:icoMoney, desc:'Faturamento por competência com paciente e procedimento.', scope:'period'},
      {id:'despesas', title:'Despesas', icon:icoCoins, desc:'Custos por tipo e categoria (buckets da DRE).', scope:'period'},
      {id:'receber', title:'Contas a receber', icon:icoReceipt, desc:'Parcelas com vencimento, status e data de pagamento.', scope:'period'},
      {id:'procedimentos', title:'Procedimentos', icon:icoSyringe, desc:'Catálogo com preço, custo, duração e recorrência.', scope:'full'},
      {id:'atividades', title:'Atividades', icon:icoActivity, desc:'Tarefas internas com status, prioridade e responsável.', scope:'period'},
      {id:'metas', title:'Metas', icon:icoTarget, desc:'Metas por métrica, período e escopo (clínica/cargo/pessoa).', scope:'full'},
    ];

    const exports = defs.map(d=>{
      const isFull = d.scope==='full';
      const di = d.desc.split('—');
      const descMain = di[0].trim().replace(/[,;]$/,'');
      const descHint = di.length>1 ? di.slice(1).join('—').trim().replace(/^./,c=>c.toUpperCase()) : '';
      return {
        ...d,
        descMain, descHint,
        cardBorder: d.primary ? 'hsl(var(--primary)/0.45)' : 'hsl(var(--border))',
        iconBg: d.primary ? 'hsl(var(--primary)/0.16)' : 'hsl(var(--muted))',
        iconColor: d.primary ? P : 'hsl(var(--muted-foreground))',
        actions: mkActions(d.id, d.primary),
      };
    });

    return {
      theme:this.props.theme ?? this.state.theme, ...this._notif(), navMain, presets, presetPill, exports,
      dateFrom:this.state.dateFrom, dateTo:this.state.dateTo,
      onFrom:(e)=>this.setState({dateFrom:e.target.value, preset:''}),
      onTo:(e)=>this.setState({dateTo:e.target.value, preset:''}),
      icoSearch, icoBell, icoPlus, icoCalendar,
      themeIcon:(this.props.theme??this.state.theme)==='dark'?icoMoon:icoSun,
      themeTitle:(this.props.theme??this.state.theme)==='dark'?'Modo escuro':'Modo claro',
      toggleTheme:()=> this.props.onToggleTheme ? this.props.onToggleTheme() : this.setState(s=>({theme:s.theme==='dark'?'light':'dark'})),
    };
  }
}
</script>
</body>
</html>
